name: Tag CI FastTask

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tag-ci-fasttask-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOWORK: 'off'
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.8
          cache: true
      - run: go mod download
      - run: go mod verify
      - run: go test ./...
      - run: go build -trimpath -o bin/fasttask ./cmd/fasttask

  web:
    uses: FastR-D/.github/.github/workflows/node-npm-check.yml@98eac6706014d070c5563eb75e3899611507f176
    with:
      working-directory: web
